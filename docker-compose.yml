# =============================================================================
# Office Suite v7.2 — Docker Compose
# =============================================================================
# Target: Oracle ARM Always Free VM (24GB RAM, 200GB storage)
# Status: Phase 1 Complete - Core Backend Foundation
# =============================================================================

version: "3.9"

services:
  # ─── Core Infrastructure ───────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_suite}
      POSTGRES_USER: ${POSTGRES_USER:-office_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-office_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Application ───────────────────────────────────────────────────────────

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
      - TYPESENSE_HOST=${TYPESENSE_HOST}
      - QDRANT_HOST=${QDRANT_HOST}
      # Cloud Storage Services (optional)
      - CLOUDINARY_ENABLED=${CLOUDINARY_ENABLED:-false}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - BOX_ENABLED=${BOX_ENABLED:-false}
      - BOX_CLIENT_ID=${BOX_CLIENT_ID}
      - BOX_CLIENT_SECRET=${BOX_CLIENT_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - CLOUDINARY_ENABLED=${CLOUDINARY_ENABLED:-false}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - BOX_ENABLED=${BOX_ENABLED:-false}
      - BOX_CLIENT_ID=${BOX_CLIENT_ID}
      - BOX_CLIENT_SECRET=${BOX_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./worker/app:/app/app
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Workers ───────────────────────────────────────────────────────────────

  celery-worker-general:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.worker worker -Q default -c 4 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  celery-worker-ocr:
    build:
      context: ./worker
      dockerfile: Dockerfile.ocr
    restart: unless-stopped
    command: celery -A app.worker worker -Q ocr -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3G  # Increased from 2G for PaddleOCR

  # ─── Search ────────────────────────────────────────────────────────────────

  typesense:
    image: typesense/typesense:27.1.rc1
    restart: unless-stopped
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data
    ports:
      - "127.0.0.1:8108:8108"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Communication ─────────────────────────────────────────────────────────

  dendrite:
    image: matrixdotorg/dendrite-monolith:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - dendrite_data:/var/dendrite
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"   # HTTP API
      - "127.0.0.1:7881:7881"   # WebSocket
      - "127.0.0.1:7882:7882/udp"  # Media (TURN/UDP)
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`livekit.${DOMAIN}`)"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7880 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Authentication ────────────────────────────────────────────────────────

  authentik:
    image: ghcr.io/goauthentik/server:2024.2
    restart: unless-stopped
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_REDIS__HOST=redis
      - AUTHENTIK_REDIS__PASSWORD=${REDIS_PASSWORD}
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__USER=${POSTGRES_USER}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTIK_POSTGRESQL__NAME=authentik
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Reverse Proxy ─────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Monitoring ────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:10.3
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: grafana/loki:2.9
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Automation ────────────────────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=CHANGE_ME_N8N_PASSWORD
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    deploy:
      resources:
        limits:
          memory: 512M

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng_data:/etc/searxng
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── AI & Knowledge Base ─────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=2m  # Reduced from 5m to reclaim RAM
    networks:
      - default
    # No ports exposed to the internet - internal only
    # Optional: Add ports: - "127.0.0.1:11434:11434" for local testing
    deploy:
      resources:
        limits:
          memory: 6G  # Increased from 2G for larger models
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  karakeep:
    image: ghcr.io/karakeep-app/karakeep:latest
    container_name: karakeep
    restart: unless-stopped
    volumes:
      - karakeep_data:/app/data
    environment:
      - NEXTAUTH_SECRET=${KARAKEEP_NEXTAUTH_SECRET:-CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_32}
      - NEXTAUTH_URL=${KARAKEEP_NEXTAUTH_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/karakeep
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - default
    # Optional: Expose via Traefik for external access
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.karakeep.rule=Host(`karakeep.${DOMAIN}`)"
    #   - "traefik.http.services.karakeep.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Backup & Storage ─────────────────────────────────────────────────────

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    volumes:
      - rclone_config:/config/rclone
      - ./backups:/backups
    environment:
      - RCLONE_CONFIG=/config/rclone/rclone.conf
    command: rcd --rc-addr=0.0.0.0:5572 --rc-no-auth
    networks:
      - default
    # Expose rclone API for backup management
    ports:
      - "127.0.0.1:5572:5572"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5572/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Decentralized Storage ────────────────────────────────────────────────

  swarm-mcp:
    image: ethersphere/swarm-mcp:latest
    container_name: swarm-mcp
    restart: unless-stopped
    volumes:
      - swarm_data:/root/.swarm
    environment:
      - SWARM_API_URL=${SWARM_API_URL:-https://api.swarm-gateways.net}
      - SWARM_BEE_NODE=${SWARM_BEE_NODE:-}
    networks:
      - default
    # No ports exposed - internal only
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "echo 'ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Self-Hosted Storage UI ──────────────────────────────────────────────

  cloudreve:
    image: cloudreve/cloudreve:latest
    container_name: cloudreve
    restart: unless-stopped
    volumes:
      - cloudreve_uploads:/cloudreve/uploads
      - cloudreve_config:/cloudreve/conf
      - cloudreve_db:/cloudreve/db
      - cloudreve_avatar:/cloudreve/avatar
    environment:
      # Cloudreve connects to all S3-compatible backends
      - CLOUDREVE_DB_TYPE=postgres
      - CLOUDREVE_DB_HOST=postgres
      - CLOUDREVE_DB_PORT=5432
      - CLOUDREVE_DB_USER=${POSTGRES_USER}
      - CLOUDREVE_DB_PASSWORD=${POSTGRES_PASSWORD}
      - CLOUDREVE_DB_NAME=cloudreve
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloudreve.rule=Host(`storage.${DOMAIN}`)"
      - "traefik.http.services.cloudreve.loadbalancer.server.port=5212"
      # Admin-only access - requires authentication middleware
      - "traefik.http.routers.cloudreve.middlewares=admin-auth"
      - "traefik.http.middlewares.admin-auth.basicauth.users=${CLOUDREVE_ADMIN_USER}:${CLOUDREVE_ADMIN_PASSWORD_HASH}"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5212/api/v3/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Security & Monitoring (Lightweight) ───────────────────────────────────

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - GID=${DOCKER_GID:-1000}
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
      - BOUNCER_KEY_TRAEFIK=${CROWDSEC_TRAEFIK_BOUNCER_KEY:-CHANGE_ME}
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - /var/log/traefik:/var/log/traefik:ro
    networks:
      - default
    # Traefik integration via labels
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crowdsec.rule=Host(`crowdsec.${DOMAIN}`)"
      - "traefik.http.services.crowdsec.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD-SHELL", "cscli metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - clamav_scan:/scan
    environment:
      - CLAMAV_NO_MILTERD=true
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - default
    ports:
      - "127.0.0.1:9000:9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  cockpit:
    image:cockpit/cockpit:latest
    container_name: cockpit
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOST=/host
    networks:
      - default
    ports:
      - "127.0.0.1:9090:9090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cockpit.rule=Host(`cockpit.${DOMAIN}`)"
      - "traefik.http.services.cockpit.loadbalancer.server.port=9090"
    deploy:
      resources:
        limits:
          memory: 30M
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:9090 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    ports:
      - "127.0.0.1:3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  qdrant_data:
  dendrite_data:
  grafana_data:
  loki_data:
  traefik_certs:
  n8n_data:
  searxng_data:
  ollama_data:
  karakeep_data:
  rclone_config:
  swarm_data:
  crowdsec_data:
  crowdsec_config:
  clamav_data:
  clamav_scan:
  portainer_data:
  uptime_kuma_data:
  cloudreve_uploads:
  cloudreve_config:
  cloudreve_db:
  cloudreve_avatar:
